server {
    listen 80;
    server_name _;

    client_max_body_size 4096M;   # DVR footage is multi-GB; nginx's 1MB default silently 413s uploads

    # nginx's default send_timeout (60s, between successive writes to the
    # *client*) was cutting off large-file downloads to the browser on slow
    # links well before transfer completion. proxy_read_timeout/send_timeout
    # below only cover nginx<->backend, not nginx<->client, so this needs to
    # be set separately at server level.
    send_timeout 3600s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing fallback
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream the upload through instead of buffering the whole multi-GB body first
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }
}

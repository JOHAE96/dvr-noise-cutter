[project]
name = "dvr-noise-cutter"
version = "0.1.0"
description = "Detect and remove analog-noise segments from FPV DVR recordings"
readme = "README.md"
authors = [
    { name = "Johannes", email = "hello@johanneshaeuser.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "typer>=0.27.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[project.scripts]
dvr-noise-cutter = "dvr_noise_cutter.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
